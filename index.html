<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyLink - Student Peer Tutoring</title>
    <style>
        :root {
            --cream: #F7F1E5;
            --off-white: #FFFDF8;
            --dark-cocoa: #4A3728;
            --warm-brown: #795548;
            --warm-beige: #E8DCC8;
            --dark-taupe: #594A3C;
            --muted-green: #718A6B;
        }
        body {
            background-color: var(--cream);
            color: var(--dark-taupe);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--dark-cocoa);
            color: var(--off-white);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-primary {
            background-color: var(--warm-brown);
            color: var(--off-white);
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .card {
            background-color: var(--off-white);
            border: 1px solid var(--warm-beige);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1rem;
            box-shadow: 0 4px 6px rgba(74, 55, 40, 0.05);
        }
    </style>
</head>
<body>
    <header>
        <h2>StudyLink</h2>
        <button class="btn-primary">Login / Sign Up</button>
    </header>
    <main>
        <div class="card">
            <h3>Peer Learning Made Easy</h3>
            <p>Connect with fellow students, find academic support, and share knowledge through peer tutoring[cite: 1].</p>
            <button class="btn-primary">Find a Tutor</button>
        </div>
    </main>
</body>
</html>
